<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقشه‌یاب کیبورد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --deck:#1b1d21; --deck-2:#202329; --key:#2b2e34; --ink:#ece8e1; --ink-dim:#8b8f98;
  --accent:#3e7cb1; --accent-soft:rgba(62,124,177,.22); --danger:#b1543e;
}
[data-profile="en"]{ --accent:#4e9c6d; --accent-soft:rgba(78,156,109,.22); }
[data-profile="fa"]{ --accent:#c08a3e; --accent-soft:rgba(192,138,62,.22); }

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:transparent; }
body{ font-family:'IBM Plex Sans', system-ui, sans-serif; color:var(--ink); display:flex; justify-content:center; padding:18px 12px 26px; }
.app{ width:100%; max-width:980px; background:linear-gradient(180deg,var(--deck-2),var(--deck)); border:1px solid #000; border-radius:14px; padding:20px 20px 16px; box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px rgba(0,0,0,.35); }

.header{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
.header h1{ font-size:16.5px; font-weight:600; margin:0 0 4px; }
.header p{ margin:0; font-size:12px; color:var(--ink-dim); max-width:50ch; line-height:1.6; }

.tabs{ display:flex; gap:6px; }
.tab{ font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:8px 14px; border-radius:6px; border:1px solid #000; background:var(--key); color:var(--ink-dim); box-shadow:0 2px 0 #000; }
.tab[data-active="true"]{ background:var(--accent); color:#12141a; }

.controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.mode-switch{ display:flex; background:var(--key); border:1px solid #000; border-radius:8px; padding:3px; gap:3px; }
.mode-btn{ font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:5px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer; }
.mode-btn[data-active="true"]{ background:var(--accent-soft); color:var(--ink); }
.states{ display:flex; gap:5px; flex-wrap:wrap; }
.state-btn{ font-family:inherit; font-size:11px; font-weight:500; padding:6px 9px; border-radius:5px; border:1px solid #000; background:var(--key); color:var(--ink-dim); cursor:pointer; }
.state-btn[data-active="true"]{ background:var(--accent); color:#12141a; }
.state-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-inline-end:5px; vertical-align:middle; }
.progress{ font-size:11.5px; color:var(--ink-dim); direction:ltr; text-align:right; white-space:nowrap; }
.progress b{ color:var(--ink); }
.save-flag{ font-size:11px; color:#4e9c6d; opacity:0; transition:opacity .2s; margin-inline-start:8px; }
.save-flag.show{ opacity:1; }

.kbwrap{ direction:ltr; position:relative; width:100%; border-radius:10px; overflow:hidden; border:1px solid #000; background:#000; }
.kbwrap img{ display:block; width:100%; height:auto; }
.overlay{ position:absolute; inset:0; }
.key{
  position:absolute; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono', monospace; font-size:1.6vw; font-weight:600; color:#e9e6df;
  border-radius:6%; cursor:default; user-select:none; text-align:center; line-height:1.05;
  background:rgba(0,0,0,0); border:2px solid rgba(255,255,255,0);
  transition:background .06s ease, border-color .06s ease;
}
.key.clickable{ cursor:pointer; }
.key.fixed{ font-family:'IBM Plex Sans',sans-serif; font-size:1.05vw; font-weight:600; color:#b9bcc3; }
.key.decorative{ color:#5a5d63; font-size:.95vw; }
.key.unlearned{ color:#5a5d63; }
.key.pressed{ background:var(--accent); color:#12141a; }
.key.mod-on{ border-color:var(--accent); background:var(--accent-soft); }
.key .dots{ position:absolute; bottom:6%; display:flex; gap:2px; }
.key .dots span{ width:5px; height:5px; border-radius:50%; background:#000; opacity:.4; }
.key .dots span.on{ opacity:1; }
@media (max-width:640px){ .key{ font-size:2.6vw; } .key.fixed{ font-size:1.9vw; } .key.decorative{ font-size:1.7vw; } .header p{ display:none; } }

.footer{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.status{ font-size:12px; color:var(--ink-dim); min-height:16px; }
.status b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }
.actions{ display:flex; gap:8px; }
.btn{ font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; padding:7px 12px; border-radius:6px; border:1px solid #000; background:var(--key); color:var(--ink-dim); }
.btn.danger:hover{ background:var(--danger); color:#12141a; }
.btn:hover{ color:var(--ink); }
.hint{ font-size:11.5px; color:var(--ink-dim); background:var(--accent-soft); border:1px solid #000; border-radius:8px; padding:9px 11px; margin-bottom:12px; line-height:1.7; }
.hint b{ color:var(--ink); }
</style>
</head>
<body>
<div class="app" id="app" data-profile="tr">

  <div class="header">
    <div>
      <h1>نقشه‌یاب کیبورد فیزیکی</h1>
      <p>روی همان عکس واقعی کیبورد لپ‌تاپ شما. سه پروفایل ترکی/انگلیسی/فارسی را یاد می‌گیرد و چیدمان واقعی هرکدام را نشان می‌دهد.</p>
    </div>
    <div class="tabs" id="profileTabs">
      <button class="tab" data-profile="tr">ترکی</button>
      <button class="tab" data-profile="en">English</button>
      <button class="tab" data-profile="fa">فارسی</button>
    </div>
  </div>

  <div id="storageBanner" style="font-size:11.5px; font-weight:600; padding:8px 11px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid #000; margin-bottom:12px;">در حال بررسی وضعیت ذخیره‌سازی…</div>
  <input id="captureInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; border:none; padding:0; pointer-events:none;">

  <div class="controls">
    <div class="mode-switch">
      <button class="mode-btn" data-mode="view">نمایش</button>
      <button class="mode-btn" data-mode="learn">یادگیری</button>
    </div>
    <div class="states" id="stateButtons"></div>
    <div class="progress" id="progress"><span id="progressText"></span><span class="save-flag" id="saveFlag">ذخیره شد ✓</span></div>
  </div>

const LS_PREFIX = 'kb_mapper_';

async function detectStorage(){
  const testKey = '__kb_test__';
  try{
    if(window.storage && typeof window.storage.set==='function'){
      await window.storage.set(testKey, '1', false);
      const r = await window.storage.get(testKey, false);
      if(r && r.value==='1'){ storageBackend = 'cloud'; return; }
    }
  }catch(e){ /* fall through */ }
  try{
    localStorage.setItem(LS_PREFIX+testKey, '1');
    const v = localStorage.getItem(LS_PREFIX+testKey);
    localStorage.removeItem(LS_PREFIX+testKey);
    if(v==='1'){ storageBackend = 'local'; return; }
  }catch(e){ /* fall through */ }
  storageBackend = null;
}

async function storeGet(key){
  if(storageBackend==='cloud'){
    const res = await window.storage.get(key, false);
    return (res && res.value!==undefined) ? res.value : null;
  }
  if(storageBackend==='local'){
    return localStorage.getItem(LS_PREFIX+key);
  }
  return null;
}
async function storeSet(key, value){
  if(storageBackend==='cloud'){
    await window.storage.set(key, value, false);
    return true;
  }
  if(storageBackend==='local'){
    localStorage.setItem(LS_PREFIX+key, value);
    return true;
  }
  return false;
}

function updateStorageBanner(){
  const el = document.getElementById('storageBanner');
  if(!el) return;
  if(storageBackend==='cloud' || storageBackend==='local'){

    el.style.color = '#4e9c6d';
  } else {
    el.textContent = '⚠ ذخیره‌سازی در این محیط کار نمی‌کند — یادگیری‌ها فقط تا پایان همین جلسه باقی می‌مانند و با بستن صفحه پاک می‌شوند. این فایل HTML را دانلود کرده و مستقیماً در مرورگر خودتان (نه در همین پیش‌نمایش) باز کنید تا ذخیره‌سازی کار کند.';
    el.style.color = '#d68a4e';
  }
}

async function loadProfile(p){
  try{
    const raw = await storeGet('kbprofile:'+p);
    if(raw){ state.profiles[p] = JSON.parse(raw); }
  }catch(e){ /* nothing saved yet */ }
}

function flashSaved(){
  const el = document.getElementById('saveFlag');
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 1200);
}
function scheduleSave(p){
  pendingSaveProfile = p;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 250);
}
async function flushSave(){
  const p = pendingSaveProfile;
  if(!p) return;
  pendingSaveProfile = null;
  try{
    const ok = await storeSet('kbprofile:'+p, JSON.stringify(state.profiles[p]));
    if(ok){ flashSaved(); } else { setStatus('⚠ ذخیره‌سازی در این محیط ممکن نیست — این یادگیری فقط تا پایان همین جلسه می‌ماند.'); }
  }catch(e){
    setStatus('⚠ ذخیره‌سازی ناموفق بود — این یادگیری فقط تا پایان همین جلسه می‌ماند.');
  }
}

// ---------- build overlay ----------
const overlayEl = document.getElementById('overlay');
const keyEls = {};

KEYS.forEach(k=>{
  const el = document.createElement('div');
  const isModKey = !!k.mod;
  el.className = 'key' + (k.fixed!==null && k.fixed!==undefined ? ' fixed' : '') + (k.decorative ? ' decorative' : '') + (isModKey ? ' clickable' : '');
  el.style.left = k.l+'%'; el.style.top = k.t+'%'; el.style.width = k.w+'%'; el.style.height = k.h+'%';

  const label = document.createElement('span');
  label.className = 'label';
  el.appendChild(label);

  if((k.fixed===null||k.fixed===undefined) && !k.decorative){
    const dots = document.createElement('div');
    dots.className = 'dots';
    STATES.forEach(s=>{
      const d = document.createElement('span');
      d.dataset.state = s.id;
      d.style.background = s.color;
      dots.appendChild(d);
    });
    el.appendChild(dots);
  }
  overlayEl.appendChild(el);
  keyEls[k.code] = { el, label, meta:k };

  if(isModKey){
    el.addEventListener('click', ()=>{
      state.viewState = (state.viewState === k.mod) ? 'normal' : k.mod;
      render();
    });
  }
});

function buildStateButtons(){
  const wrap = document.getElementById('stateButtons');
  wrap.innerHTML = '';
  STATES.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'state-btn';
    b.dataset.state = s.id;
    b.innerHTML = '<span class="state-dot" style="background:'+s.color+'"></span>'+s.label;
    b.addEventListener('click', ()=>{ state.viewState = s.id; render(); });
    wrap.appendChild(b);
  });
}

// ---------- render ----------
function render(){
  document.getElementById('app').dataset.profile = state.profile;

  document.querySelectorAll('.tab').forEach(t=>{ t.dataset.active = (t.dataset.profile===state.profile)?'true':'false'; });
  document.querySelectorAll('.mode-btn').forEach(b=>{ b.dataset.active = (b.dataset.mode===state.mode)?'true':'false'; });
  document.querySelectorAll('.state-btn').forEach(b=>{ b.dataset.active = (b.dataset.state===state.viewState)?'true':'false'; });

  ['ShiftLeft','ShiftRight','CapsLock','AltRight'].forEach(code=>{
    const ke = keyEls[code]; if(!ke) return;
    const mod = (code==='CapsLock') ? 'caps' : (code==='AltRight') ? 'altgr' : 'shift';
    ke.el.classList.toggle('mod-on', state.viewState === mod);
  });

  const data = state.profiles[state.profile] || {};
  let learnedCount = 0;

  KEYS.forEach(k=>{
    const ke = keyEls[k.code];
    if(k.decorative){ return; }
    if(k.fixed !== null && k.fixed !== undefined){ return; }
    const cell = data[k.code] || {};
    STATES.forEach(s=>{ if(cell[s.id]!==undefined) learnedCount++; });
    const val = cell[state.viewState];
    ke.label.textContent = (val===undefined) ? '·' : (val==='Dead' ? '¨' : (val===' ' ? '␣' : val));
    ke.el.classList.toggle('unlearned', val===undefined);
    const dots = ke.el.querySelectorAll('.dots span');
    dots.forEach(d=>{ d.classList.toggle('on', cell[d.dataset.state]!==undefined); });
  });

  document.getElementById('progressText').innerHTML =
    'یادگیری‌شده: <b>'+learnedCount+'</b> / '+TOTAL_CELLS+' ('+PROFILE_LABEL[state.profile]+') — حالت فعلی: <b>'+STATES.find(s=>s.id===state.viewState).label+'</b>';
}

function syncFromMods(){ state.viewState = idFromBits(heldShift, lastKnownCaps, heldAltGr); }

  if(v===undefined) return '؟';
  if(v==='Dead') return 'کلید مرکب (Dead key)';
  if(v===' ') return 'فاصله';

}

function focusCapture(){ try{ captureInput.focus({preventScroll:true}); }catch(_){ captureInput.focus(); } }
focusCapture();
document.addEventListener('mouseup', ()=>setTimeout(focusCapture,0));
window.addEventListener('focus', focusCapture);

function finalizeRecord(code, sName, val){
  const displayVal = (val===undefined || val==='') ? pendingFallbackKey : val;
  if(state.mode==='learn'){
    const p = state.profile;
    if(!state.profiles[p][code]) state.profiles[p][code] = {};
    state.profiles[p][code][sName] = displayVal;
    scheduleSave(p);
    render();
    setStatus('ثبت شد: <b>'+code+'</b> ← «'+STATES.find(s=>s.id===sName).label+'» ← <b>'+displayChar(displayVal)+'</b>');
  } else {
    const cell = (state.profiles[state.profile][code]||{});
    const v = cell[sName];
    setStatus('کلید <b>'+code+'</b> در حالت «'+STATES.find(s=>s.id===sName).label+'» ('+PROFILE_LABEL[state.profile]+'): <b>'+displayChar(v)+'</b>');
  }
}

captureInput.addEventListener('input', function(){
  const val = captureInput.value;
  captureInput.value = '';
  if(pendingCode===null) return;
  if(val.length===0) return; // first stage of a dead-key sequence — wait for more
  clearTimeout(pendingTimer);
  finalizeRecord(pendingCode, pendingState, val);
  pendingCode = null; pendingState = null; pendingFallbackKey = null;
});

window.addEventListener('keydown', function(e){
  if(!ALL_LISTEN_CODES.has(e.code)) return;
  if(e.code==='Tab') e.preventDefault(); // keep focus on the hidden capture field
  if(e.ctrlKey && !e.altKey) e.preventDefault(); // block real Ctrl+key browser shortcuts, but not Ctrl+Alt (AltGr on Windows)

  const ke = keyEls[e.code];
  if(ke) ke.el.classList.add('pressed');

  const rawKeyEl = document.getElementById('liveKey');
  if(rawKeyEl){
    const shown = e.key===' ' ? 'فاصله' : e.key;
    rawKeyEl.innerHTML = 'آخرین کلید فیزیکی: <b>'+e.code+'</b> ← کیبورد الان می‌فرستد: <b>'+shown+'</b>';
  }

  try{ lastKnownCaps = e.getModifierState('CapsLock'); }catch(_){}

  if(e.code==='ShiftLeft' || e.code==='ShiftRight'){ heldShift = true; }
  if(e.code==='AltRight'){ heldAltGr = true; }
  syncFromMods();

  const isChar = (ke.meta.fixed===null||ke.meta.fixed===undefined) && !ke.meta.decorative;

  if(isChar){
    let altgrFlag = heldAltGr;
    try{ if(e.getModifierState('AltGraph')) altgrFlag = true; }catch(_){}
    if(!altgrFlag && e.ctrlKey && e.altKey) altgrFlag = true;
    const shiftFlag = heldShift || e.shiftKey;
    state.viewState = idFromBits(shiftFlag, lastKnownCaps, altgrFlag);
  }
  render();

  if(!isChar) return;

  // Let the browser actually type into the hidden focused input (no preventDefault here)
  // so the OS/browser applies the real layout — including multi-character results like ﷼.
  pendingCode = e.code;
  pendingState = state.viewState;
  pendingFallbackKey = e.key;
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(()=>{
    if(pendingCode===e.code){
      // no input event arrived (e.g. a true dead key) — fall back to e.key
      finalizeRecord(pendingCode, pendingState, captureInput.value || pendingFallbackKey);
      captureInput.value = '';
      pendingCode = null; pendingState = null; pendingFallbackKey = null;
    }
  }, 60);
}, true);

window.addEventListener('keyup', function(e){
  if(!ALL_LISTEN_CODES.has(e.code)) return;
  const ke = keyEls[e.code];
  if(ke) ke.el.classList.remove('pressed');
  if(e.code==='ShiftLeft' || e.code==='ShiftRight'){ heldShift = false; }
  if(e.code==='AltRight'){ heldAltGr = false; }
  try{ lastKnownCaps = e.getModifierState('CapsLock'); }catch(_){}
  syncFromMods();
  render();
});

// ---------- controls ----------
document.getElementById('profileTabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(!t) return;
  state.profile = t.dataset.profile;
  setStatus('پروفایل «'+PROFILE_LABEL[state.profile]+'» انتخاب شد. یادتان باشد زبان کیبورد سیستم‌عامل را هم خودتان روی همین زبان بگذارید.');
  render();
});
document.querySelector('.mode-switch').addEventListener('click', e=>{
  const b = e.target.closest('.mode-btn');
  if(!b) return;
  state.mode = b.dataset.mode;
  setStatus(state.mode==='learn'
    ? 'حالت یادگیری فعال است — یک حالت (عادی/Shift/AltGr...) را از پایین یا با کلیک روی کلیدهای Shift/Caps/AltGr در تصویر انتخاب کنید، سپس کلید فیزیکی را فشار دهید.'
    : 'حالت نمایش فعال است.');
  render();
});
document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('همه‌ی داده‌های یادگرفته‌شده برای پروفایل «'+PROFILE_LABEL[state.profile]+'» پاک شود؟')) return;
  state.profiles[state.profile] = {};
  try{ await storeSet('kbprofile:'+state.profile, JSON.stringify({})); flashSaved(); }catch(e){}
  render();
});

// ---------- init ----------
(async function init(){
  setStatus('در حال بررسی امکان ذخیره‌سازی و بارگذاری داده‌ها…');
  await detectStorage();
  updateStorageBanner();
  await Promise.all(['tr','en','fa'].map(loadProfile));
  render();
  setStatus('آماده — روی کلیدی از کیبورد فیزیکی خود فشار دهید تا مقدار واقعی آن را ببینید.');
})();

})();
</script>
</body>
